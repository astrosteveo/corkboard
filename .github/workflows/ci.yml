name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff format --check
      - run: uvx ruff check
      # The terminal install: build the package from this checkout and run the command.
      - run: uvx --from . corkboard help
      # The web app must be in the package too, or corkboard ui from that install has no page.
      - run: uv build --wheel --out-dir dist && python3 -m zipfile -l dist/*.whl | grep corkboard/web/index.html
